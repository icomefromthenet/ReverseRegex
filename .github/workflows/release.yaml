name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:

    name: GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## \[/ { if (found) exit; found = index($0, "[" tag "]") }
            found && !/^## \[/ && !/^\[[^]]*\]: / { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No section for $GITHUB_REF_NAME found in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
